<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greta and the Far Meadow — Animated SVG Story</title>
<style>
  :root {
    --ink: #23252d;
    --bar-bg: rgba(12, 16, 28, 0.92);
    --accent: #f0b45a;
    --accent2: #9fd8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #070b16;
    color: #e8e6df;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    width: 100vw;
    height: 100vh;
    max-width: 1280px;
    display: flex;
    flex-direction: column;
    background: #0c1120;
  }
  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    background: var(--bar-bg);
    border-bottom: 1px solid rgba(255,255,255,.08);
    z-index: 5;
  }
  .hud-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  #segNum {
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
  }
  #segName { font-size: 17px; font-weight: 600; color: #f3ead9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-controls { display: flex; gap: 6px; }
  .hud-controls button {
    background: #1b2438;
    color: #e8e6df;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 8px;
    min-width: 36px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .hud-controls button:hover { background: #27324e; }
  .hud-controls button:active { transform: scale(.94); }
  /* ---------- STAGE ---------- */
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #05080f;
  }
  .scene {
    position: absolute;
    inset: 0;
    display: none;
  }
  .scene.active { display: block; }
  .scene svg { width: 100%; height: 100%; display: block; }
  /* ---------- BOTTOM HUD ---------- */
  #bottomHud {
    background: var(--bar-bg);
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 8px 14px;
    z-index: 5;
  }
  #dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 7px; flex-wrap: wrap; }
  #dots button {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
    background: transparent; cursor: pointer; padding: 0;
    transition: background .2s, transform .15s;
  }
  #dots button.on { background: var(--accent); border-color: var(--accent); transform: scale(1.35); }
  #progWrap { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  #progFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: progFill var(--dur, 8s) linear forwards; }
  /* ---------- WARP TRANSITION ---------- */
  #warp {
    position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background: radial-gradient(circle at 50% 55%, #1a2340 0%, #070b16 72%);
    clip-path: circle(0% at 50% 55%);
  }
  #ring {
    position: fixed; left: 50%; top: 55%; z-index: 65; pointer-events: none;
    width: 120px; height: 120px; border-radius: 50%;
    border: 5px solid var(--accent2);
    box-shadow: 0 0 34px rgba(159,216,255,.9), inset 0 0 34px rgba(159,216,255,.6);
    opacity: 0; transform: translate(-50%,-50%) scale(.05);
  }
  #ring.on { animation: warpRing .85s ease-out forwards; }
  #flash {
    position: fixed; inset: 0; z-index: 70; pointer-events: none;
    background: radial-gradient(circle at 50% 55%, #ffffff 0%, #eaf4ff 45%, rgba(234,244,255,0) 78%);
    opacity: 0;
  }
  #flash.on { animation: flashOn .34s ease-out forwards; }
  /* ---------- SCENE ANIMATIONS ---------- */
  .scene.active .star { animation: twinkle 2.6s ease-in-out infinite alternate; }
  .scene.active .cloud { animation: cloudDrift linear infinite; }
  .scene.active .moonG { animation: glowPulse 5s ease-in-out infinite alternate; }
  .scene.active .grassTuft { animation: grassSway var(--dur, 2.4s) ease-in-out infinite alternate; }
  .scene.active .bgScroll { animation: bgScroll 4.2s linear infinite; }
  .scene.active .bob { animation: bob var(--dur, .62s) ease-in-out infinite alternate; }
  .scene.active .legSwing { animation: swing var(--dur, .62s) ease-in-out infinite alternate; }
  .scene.active .tailG { animation: tailSway 1.1s ease-in-out infinite alternate; }
  .scene.active .shiver { animation: shiver .13s linear infinite alternate; }
  .scene.active .shiverSlow { animation: shiver 1.6s ease-in-out infinite alternate; }
  .scene.active .walker { animation: walkOut var(--dur, 4.6s) linear forwards; }
  .scene.active .farmerEnter { animation: farmerEnter 2.5s cubic-bezier(.3,.7,.25,1) forwards; }
  .scene.active .dogEnter { animation: dogEnter 2.6s cubic-bezier(.3,.7,.25,1) forwards; }
  .scene.active .ripple { animation: rippleMove 3.4s ease-in-out infinite alternate; }
  .scene.active .leaf { animation: leafFall 4.6s linear infinite; }
  .scene.active .wingL { animation: wingFlap 0.7s ease-in-out infinite alternate; transform-origin: 0px 5px; }
  .scene.active .wingR { animation: wingFlap 0.7s ease-in-out infinite alternate; transform-origin: 0px 5px; animation-delay: -.35s; }
  .scene.active .breathe { animation: breathe 2.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .scene.active .bubble { opacity: 0; animation: bubblePop var(--bdur, 3s) ease-out var(--bd, 1s) forwards; transform-box: fill-box; transform-origin: 50% 100%; }
  .nar-bg { fill: rgba(14, 20, 32, .82); stroke: rgba(240, 180, 90, .5); stroke-width: 1.5; }
  .nar-text { font-family: Georgia, serif; font-style: italic; font-size: 20px; fill: #ffe9c2; letter-spacing: .4px; }
  .scene.active .narration { opacity: 0; animation: bubblePop var(--bdur, 3.2s) ease-out var(--bd, 0.8s) forwards; transform-box: fill-box; transform-origin: 50% 0%; }
  .scene.active .titleBig { animation: titleFloat 5s ease-in-out infinite alternate; }
  .scene.active .titleHint { animation: blink 2.2s ease-in-out infinite; }
  .scene.active .captionEnd { opacity: 0; animation: captionIn 1.6s ease-out var(--bd, 8s) forwards; }
  body.paused #progFill { animation-play-state: paused !important; }
  body.paused .scene.active * { animation-play-state: paused !important; }
  /* ---------- KEYFRAMES ---------- */
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes swing { from { transform: rotate(-26deg); } to { transform: rotate(24deg); } }
  @keyframes tailSway { from { transform: rotate(-18deg); } to { transform: rotate(20deg); } }
  @keyframes shiver { from { transform: translateX(-2.6px); } to { transform: translateX(2.6px); } }
  @keyframes walkOut { from { transform: translate(var(--x0), var(--y0)); } to { transform: translate(var(--x1), var(--y1)); } }
  @keyframes bgScroll { from { transform: translateX(0); } to { transform: translateX(-480px); } }
  @keyframes cloudDrift { from { transform: translateX(-280px); } to { transform: translateX(1240px); } }
  @keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
  @keyframes grassSway { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
  @keyframes rippleMove { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
  @keyframes leafFall {
    0% { transform: translate(var(--lx), -30px) rotate(0deg); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translate(calc(var(--lx) - 90px), 520px) rotate(330deg); opacity: .15; }
  }
  @keyframes wingFlap { from { transform: rotate(-14deg); } to { transform: rotate(18deg); } }
  @keyframes breathe { from { transform: scaleY(1); } to { transform: scaleY(1.025); } }
  @keyframes farmerEnter { from { transform: translateX(1150px); } to { transform: translateX(0); } }
  @keyframes dogEnter { from { transform: translateX(1350px); } to { transform: translateX(0); } }
  @keyframes bubblePop {
    0% { opacity: 0; transform: translateY(14px) scale(.88); }
    9% { opacity: 1; transform: translateY(0) scale(1); }
    88% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(.94); }
  }
  @keyframes progFill { from { width: 0%; } to { width: 100%; } }
  @keyframes warpRing { from { transform: translate(-50%,-50%) scale(.05); opacity: 1; } to { transform: translate(-50%,-50%) scale(115); opacity: 0; } }
  @keyframes flashOn { from { opacity: 0; } 22% { opacity: .92; } to { opacity: 0; } }
  @keyframes titleFloat { from { transform: translateY(0); } to { transform: translateY(-9px); } }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes captionIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse { from { opacity: .55; } to { opacity: 1; } }
  @keyframes ringPop { from { transform: translate(-50%,-50%) scale(.05); opacity: 1; } to { transform: translate(-50%,-50%) scale(115); opacity: 0; } }
  #ring.on { animation: ringPop .85s ease-out forwards; }
  #flash.on { animation: flashOn .34s ease-out forwards; }
  /* ---------- SVG TYPOGRAPHY & BITS ---------- */
  .bub-box { fill: #fffef7; stroke: #2b2b3a; stroke-width: 3; }
  .bub-tail { fill: #fffef7; stroke: #2b2b3a; stroke-width: 3; stroke-linejoin: round; }
  .bub-text { font-family: "Segoe UI", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #26232e; }
  .titleBig { font-family: Georgia, "Times New Roman", serif; font-size: 92px; font-weight: 700; fill: #fff8ea; letter-spacing: 4px; }
  .titleSub { font-family: Georgia, serif; font-size: 30px; fill: #ffe3ad; letter-spacing: 6px; text-transform: uppercase; }
  .titleHint { font-family: Georgia, serif; font-size: 20px; fill: #efe4c8; letter-spacing: 2px; }
  .sceneCap { font-family: Georgia, serif; font-size: 26px; font-weight: 700; fill: #fff2d2; letter-spacing: 2px; text-anchor: middle; }
  .star { fill: #fffde9; }
  .cloud { fill: rgba(255,255,255,.82); }
  .grassTuft { stroke: #557c3f; stroke-width: 5; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%; animation: grassSway var(--dur, 2.4s) ease-in-out infinite alternate; }
  .daisy { fill: #fff8e6; stroke: #d8b25a; stroke-width: 2; }
  .leafTip { fill: #d9a24c; }
  .barnWall { fill: url(#barnGrad); stroke: #1e130e; stroke-width: 3; }
  .barnRoof { fill: #4c2f22; stroke: #1e130e; stroke-width: 3; }
  .fencePost { fill: #7c5a37; stroke: #3a2517; stroke-width: 2; }
  .fenceRail { fill: #8a6642; stroke: #3a2517; stroke-width: 2; }
  .waterLine { stroke: #dff1f6; stroke-width: 4; fill: none; stroke-linecap: round; opacity: .75; }
  .stone { fill: #a9a397; stroke: #6d675e; stroke-width: 2.5; }
  .shadow { fill: rgba(20, 32, 18, .28); }
  @media (prefers-reduced-motion: reduce) {
    .scene.active .bob, .scene.active .legSwing, .scene.active .tailG,
    .scene.active .shiver, .scene.active .grassTuft, .scene.active .cloud,
    .scene.active .ripple, .scene.active .leaf, .scene.active .wingL,
    .scene.active .wingR, .scene.active .breathe, .scene.active .bgScroll {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<!-- Shared SVG defs (referenced by every scene) -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeecb"/><stop offset=".55" stop-color="#e6e3b6"/><stop offset="1" stop-color="#c9dcae"/>
    </linearGradient>
    <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/><stop offset=".55" stop-color="#6a5370"/><stop offset="1" stop-color="#e8a86b"/>
    </linearGradient>
    <linearGradient id="skyWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd9b8"/><stop offset=".6" stop-color="#a9c48d"/><stop offset="1" stop-color="#8fae76"/>
    </linearGradient>
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cbc6e"/><stop offset="1" stop-color="#5f8a4a"/>
    </linearGradient>
    <linearGradient id="creekGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ccd8"/><stop offset="1" stop-color="#4d7d94"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".55" stop-color="#fff3c4" stop-opacity=".6"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5340"/><stop offset="1" stop-color="#4f3428"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="segNum">Segment 1 / 10</span>
      <span id="segName">Title</span>
    </div>
    <div class="hud-controls">
      <button id="btnPrev" title="Previous scene">‹</button>
      <button id="btnPlay" title="Pause / play">❚❚</button>
      <button id="btnNext" title="Next scene">›</button>
      <button id="btnRestart" title="Replay from the beginning">⟲</button>
    </div>
  </header>
  <main id="stage"></main>
  <footer id="bottomHud">
    <div id="dots"></div>
    <div id="progWrap"><div id="progFill"></div></div>
  </footer>
</div>

<div id="warp"></div>
<div id="ring"></div>
<div id="flash"></div>

<script>
/* ================================================================
   Greta and the far meadow — animated SVG story
   Each segment is a self-contained inline SVG. Animations run via CSS
   once the scene is .active (display: none → block restarts them).
   Speech bubbles are placed by a procedural procedure (see below):
   text measurements via canvas, frame / character / bubble-overlap
   constraints, and a priority-ordered set of candidate positions.
   ================================================================ */
const $ = s => document.querySelector(s);

/* ---------------- shared art builders ---------------- */
function cowSVG(walking, silhouette) {
  const ink = silhouette ? '#43302a' : '#3a2517';
  const body = silhouette ? '#43302a' : '#6e4a33';
  const leg = silhouette ? '#3a2a20' : '#4d3524';
  const far = silhouette ? '#36271f' : '#3d2a1c';
  const udder = silhouette ? '#43302a' : '#d8a48f';
  const collarC = silhouette ? '#43302a' : '#efe9dc';
  const muzzle = silhouette ? '#43302a' : '#d8a48f';
  const tut = silhouette ? '#3a2a20' : '#2e2018';
  const hoof = silhouette ? '#33231c' : '#2e1e14';
  const horn = silhouette ? '#3a2a20' : '#e3d7bd';
  const durVar = walking ? 'var(--legDur, .62s)' : '0s';
  const legAnim = walking ? 'legSwing' : '';
  return `
  <g class="bob" style="--dur:${durVar}">
    <g transform="translate(-70,-12)"><g class="tailG">
      <path d="M0 0 C -13 20, -14 46, -6 70" stroke="${leg}" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="-6" cy="74" rx="7" ry="11" fill="${tut}"/>
    </g></g>
    <g transform="translate(-30,34)"><g class="${legAnim}" style="--dur:${durVar}"><rect x="-6" y="0" width="12" height="44" rx="6" fill="${far}"/><rect x="-6" y="36" width="12" height="12" rx="5" fill="${hoof}"/></g></g>
    <g transform="translate(26,34)"><g class="${legAnim}" style="--dur:${durVar};animation-delay:-.31s"><rect x="-6" y="0" width="12" height="44" rx="6" fill="${far}"/><rect x="-6" y="36" width="12" height="12" rx="5" fill="${hoof}"/></g></g>
    <ellipse cx="0" cy="2" rx="74" ry="42" fill="${body}" stroke="${ink}" stroke-width="3"/>
    <ellipse cx="-12" cy="40" rx="21" ry="11" fill="${udder}" stroke="${ink}" stroke-width="2.2"/>
    <ellipse cx="50" cy="-4" rx="12" ry="36" fill="${collarC}" stroke="${ink}" stroke-width="2.2" transform="rotate(-9 50 -4)"/>
    <path d="M46 -14 L88 -32" stroke="${body}" stroke-width="26" stroke-linecap="round" fill="none"/>
    <ellipse cx="90" cy="-34" rx="26" ry="20" fill="${body}" stroke="${ink}" stroke-width="2.6"/>
    <ellipse cx="78" cy="-52" rx="12" ry="6" fill="${body}" stroke="${ink}" stroke-width="2.2" transform="rotate(-32 78 -52)"/>
    <ellipse cx="106" cy="-52" rx="12" ry="6" fill="${body}" stroke="${ink}" stroke-width="2.2" transform="rotate(28 106 -52)"/>
    <path d="M74 -56 q -5 -14 6 -17 l 4 9 q 3 8 -10 8 z" fill="${horn}" stroke="${ink}" stroke-width="2"/>
    <path d="M98 -56 q 7 -14 14 -11 l -3 10 q -4 6 -11 1 z" fill="${horn}" stroke="${ink}" stroke-width="2"/>
    <ellipse cx="104" cy="-24" rx="15" ry="11" fill="${muzzle}" stroke="${ink}" stroke-width="2.2"/>
    <ellipse cx="97" cy="-27" rx="2.7" ry="2" fill="${silhouette ? '#2a1f18' : '#8a5a44'}"/>
    <ellipse cx="112" cy="-26" rx="2.7" ry="2" fill="${silhouette ? '#2a1f18' : '#8a5a44'}"/>
    <circle cx="82" cy="-38" r="5.6" fill="${silhouette ? '#43302a' : '#ffffff'}"/>
    <circle cx="100" cy="-40" r="5.6" fill="${silhouette ? '#43302a' : '#ffffff'}"/>
    ${silhouette ? '' : '<circle cx="83" cy="-38" r="2.6" fill="#1c1410"/><circle cx="101" cy="-40" r="2.6" fill="#1c1410"/><circle cx="84.2" cy="-39.8" r=".9" fill="#fff"/><circle cx="102.2" cy="-41.8" r=".9" fill="#fff"/>'}
    <g transform="translate(-44,34)"><g class="${legAnim}" style="--dur:${durVar};animation-delay:-.31s"><rect x="-6.5" y="0" width="13" height="44" rx="6" fill="${leg}"/><rect x="-6.5" y="36" width="13" height="12" rx="5" fill="${hoof}"/></g></g>
    <g transform="translate(38,34)"><g class="${legAnim}" style="--dur:${durVar}"><rect x="-6.5" y="0" width="13" height="44" rx="6" fill="${leg}"/><rect x="-6.5" y="36" width="13" height="12" rx="5" fill="${hoof}"/></g></g>
  </g>`;
}

function farmerSVG() {
  return `
  <g class="breathe">
    <rect x="-16" y="-50" width="11" height="50" rx="4" fill="#3e3326"/>
    <rect x="5" y="-50" width="11" height="50" rx="4" fill="#3e3326"/>
    <rect x="-24" y="-102" width="48" height="56" rx="12" fill="#6b543c" stroke="#2e241a" stroke-width="2.5"/>
    <rect x="-23" y="-64" width="46" height="8" fill="#3e3326"/>
    <path d="M-8 -94 L20 -60" stroke="#6b543c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-120" r="14" fill="#d9b08c" stroke="#2e241a" stroke-width="2.5"/>
    <ellipse cx="0" cy="-132" rx="24" ry="6.5" fill="#b9975d" stroke="#2e241a" stroke-width="2"/>
    <rect x="-13" y="-146" width="26" height="14" rx="5" fill="#b9975d" stroke="#2e241a" stroke-width="2"/>
    <line x1="20" y1="-60" x2="34" y2="-6" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
    <polygon points="34,-6 48,-1 42,-27 28,-24" fill="#9aa0a8" stroke="#2e241a" stroke-width="2"/>
  </g>`;
}

function dogSVG() {
  return `
  <g class="bob" style="--dur:.36s">
    <path d="M28 -44 C 40 -52, 45 -66, 41 -74" stroke="#6e533c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-32" rx="36" ry="18" fill="#8a6b4f" stroke="#3a2517" stroke-width="2.5"/>
    <path d="M-26 -42 L-42 -46" stroke="#8a6b4f" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="-48" cy="-48" r="13" fill="#8a6b4f" stroke="#3a2517" stroke-width="2.5"/>
    <ellipse cx="-57" cy="-43" rx="8" ry="6" fill="#d8c4a8" stroke="#3a2517" stroke-width="2"/>
    <circle cx="-61" cy="-45" r="2.4" fill="#241a12"/>
    <circle cx="-50" cy="-51" r="2.6" fill="#241a12"/>
    <ellipse cx="-42" cy="-62" rx="6" ry="9" fill="#6e533c" stroke="#3a2517" stroke-width="2" transform="rotate(-28 -42 -62)"/>
    <g transform="translate(-24,-16)"><g class="legSwing" style="--dur:.36s"><rect x="-3.5" y="0" width="7" height="18" rx="3.5" fill="#5c4634"/></g></g>
    <g transform="translate(16,-16)"><g class="legSwing" style="--dur:.36s;animation-delay:-.18s"><rect x="-3.5" y="0" width="7" height="18" rx="3.5" fill="#5c4634"/></g></g>
  </g>`;
}

function star(x, y, d, r) {
  return `<circle class="star" cx="${x}" cy="${y}" r="${r || 2.2}" style="animation-delay:${d}s"/>`;
}
function clouds(n, cls, baseY, dur, delays) {
  let out = '';
  for (let i = 0; i < n; i++) {
    out += `<g class="cloud ${cls || ''}" style="animation-duration:${dur}s;animation-delay:${delays[i] || 0}s"><ellipse cx="0" cy="${baseY + i * 26}" rx="52" ry="16"/><ellipse cx="38" cy="${baseY - 6 + i * 26}" rx="30" ry="13"/><ellipse cx="-36" cy="${baseY + 2 + i * 26}" rx="26" ry="11"/></g>`;
  }
  return out;
}
function grassTuft(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s || 1})"><g class="grassTuft" style="--dur:2.4s"><path d="M0 0 q 2 -16 -3 -24" fill="none"/><path d="M0 0 q 4 -18 9 -22" fill="none"/><path d="M0 0 q -4 -14 -10 -18" fill="none"/></g></g>`;
}
function daisy(x, y, s) {

/* ---------------- bubble placement procedure ----------------
   Speech bubbles are NOT hand-placed. Each scene declares its actors
   (kind, x, y, scale) and its bubbles (speaker, lines, delay, duration).
   The procedure here computes every bubble's rectangle from the scene
   facts and guarantees:
     1. the box stays inside the frame (viewBox minus margins);
     2. it does not overlap any character footprint (speaker included);
     3. it does not overlap any other bubble in the scene.
   Candidates are tried in order of preference; the tail points at the
   speaker's screen-space position. If no candidate passes every check,
   the least-bad candidate wins (always fully on-screen).
   -------------------------------------------------------------- */
const VIEW_W = 960, VIEW_H = 540;
const FRAME = { x: 14, y: 14, w: VIEW_W - 28, h: VIEW_H - 28 };

function actorBBox(a) {
  const s = a.s || 1;
  if (a.kind === 'cow') return { x: a.x - 84 * s, y: a.y - 73 * s, w: 203 * s, h: 155 * s };
  if (a.kind === 'farmer') return { x: a.x - 26 * s, y: a.y - 152 * s, w: 76 * s, h: 154 * s };
  if (a.kind === 'dog') return { x: a.x - 65 * s, y: a.y - 71 * s, w: 110 * s, h: 73 * s };
  return { x: a.x, y: a.y, w: 0, h: 0 };
}

const measuringCtx = (() => {
  const c = document.createElement('canvas').getContext('2d');
  if (c) c.font = '700 21px "Segoe UI", system-ui, sans-serif';
  return c;
})();
function measureText(lines) {
  if (!measuringCtx) return Math.max(...lines.map(l => l.length)) * 11;
  return Math.max(...lines.map(l => measuringCtx.measureText(l).width));
}

const narrationCtx = (() => {
  const c = document.createElement('canvas').getContext('2d');
  if (c) c.font = 'italic 20px Georgia, serif';
  return c;
})();
function measureNarration(text) {
  if (!narrationCtx) return text.length * 10;
  return narrationCtx.measureText(text).width;
}

function renderNarration(n) {
  // a narrator caption pinned to the top-center of the viewBox — always on-screen
  const textW = measureNarration(n.text);
  const w = Math.ceil(textW + 46);
  const h = 40;
  const x = Math.max(14, Math.min(960 - 14 - w, 480 - w / 2));
  return `<g class="narration" style="--bd:${n.d}s;--bdur:${n.dur}s">
    <rect class="nar-bg" x="${x}" y="26" width="${w}" height="${h}" rx="12"/>
    <text class="nar-text" x="${x + w / 2}" y="51" text-anchor="middle">${n.text}</text>
  </g>`;
}

function overlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
function insideFrame(box, frame) {
  return box.x >= frame.x && box.y >= frame.y && box.x + box.w <= frame.x + frame.w && box.y + box.h <= frame.y + frame.h;
}
function padBox(box, pad) {
  return { x: box.x - pad, y: box.y - pad, w: box.w + pad * 2, h: box.h + pad * 2 };
}

function placeBubble(b, speaker, characters, placedBoxes) {
  const sprite = { ...speaker.box };                       // footprint of the speaker
  const pad = 8;
  const cx = sprite.x + sprite.w / 2;
  const ideal = { x: cx - b.w / 2, y: sprite.y - 18 - b.h };
  const idealCy = sprite.y + sprite.h / 2;
  const candidates = [
    // 1: centered above the speaker (the ideal spot)
    { x: ideal.x, y: ideal.y },
    // 2: above the speaker, clamped into the frame
    { x: Math.min(Math.max(ideal.x, FRAME.x), FRAME.x + FRAME.w - b.w), y: ideal.y },
    // 3: above the speaker, shifted to one side (tail still points at the speaker)
    { x: Math.min(Math.max(sprite.x - 16, FRAME.x), FRAME.x + FRAME.w - b.w), y: ideal.y },
    { x: Math.min(Math.max(sprite.x + sprite.w - b.w + 16, FRAME.x), FRAME.x + FRAME.w - b.w), y: ideal.y },
    // 4: to the speaker's right
    { x: sprite.x + sprite.w + 24, y: idealCy - b.h / 2 },
    // 5: to the speaker's left
    { x: sprite.x - 24 - b.w, y: idealCy - b.h / 2 },
    // 6: below the speaker
    { x: Math.min(Math.max(ideal.x, FRAME.x), FRAME.x + FRAME.w - b.w), y: sprite.y + sprite.h + 24 },
    // 7: frame corners (always reachable, last resort)
    { x: FRAME.x, y: FRAME.y },
    { x: FRAME.x + FRAME.w - b.w, y: FRAME.y },
  ];
  let best = null, bestScore = Infinity, bestViolation = Infinity;
  for (const c of candidates) {
    const box = { x: c.x, y: c.y, w: b.w, h: b.h };
    let violation = 0;
    if (!insideFrame(box, FRAME)) violation += 1000;
    for (const ch of characters) {
      if (overlap(box, padBox(ch.box, pad))) violation += 10;
    }
    for (const other of placedBoxes) {
      // only constrain simultaneous visibility: if the two windows don’t
      // overlap, the two bubbles can share the same region
      const simultaneous = other.d < b.d + b.dur && b.d < other.d + other.dur;
      if (simultaneous && overlap(box, padBox(other.box, 6))) violation += 10;
    }
    const score = Math.abs(c.x + b.w / 2 - cx) + Math.abs(c.y + b.h / 2 - (sprite.y + sprite.h / 2));
    if (violation < bestViolation || (violation === bestViolation && score < bestScore)) {
      best = box; bestScore = score; bestViolation = violation;
    }
  }
  return best;
}

function buildBubble(rect, b, speaker) {
  const lines = b.lines;
  const tspans = lines.map((l, i) => `<tspan x="18" dy="${i ? 26 : 0}">${l}</tspan>`).join('');
  // tail: edge of the bubble nearest the speaker
  const scx = speaker.box.x + speaker.box.w / 2;
  const scy = speaker.box.y + speaker.box.h / 2;
  const bubbleCy = rect.y + rect.h / 2;
  let edge = 'bottom', tx = Math.min(Math.max(scx, rect.x + 24), rect.x + rect.w - 24), ty = rect.y + rect.h;
  if (bubbleCy > scy + 12) { edge = 'top'; ty = rect.y; }
  else if (Math.abs(bubbleCy - scy) <= 12) {
    if (scx < rect.x + rect.w / 2) { edge = 'left'; tx = rect.x; ty = Math.min(Math.max(scy, rect.y + 20), rect.y + rect.h - 20); }
    else { edge = 'right'; tx = rect.x + rect.w; ty = Math.min(Math.max(scy, rect.y + 20), rect.y + rect.h - 20); }
  }
  let tailPath;
  if (edge === 'bottom') tailPath = `M ${tx - 10} ${ty} L ${tx + 10} ${ty} L ${tx} ${ty + 16} Z`;
  else if (edge === 'top') tailPath = `M ${tx - 10} ${ty} L ${tx + 10} ${ty} L ${tx} ${ty - 16} Z`;
  else if (edge === 'left') tailPath = `M ${tx} ${ty - 9} L ${tx} ${ty + 9} L ${tx - 15} ${ty} Z`;
  else tailPath = `M ${tx} ${ty - 9} L ${tx} ${ty + 9} L ${tx + 15} ${ty} Z`;
  const inner = `
  <path class="bub-tail" d="${tailPath}"/>
  <rect class="bub-box" width="${rect.w}" height="${rect.h}" rx="14"/>
  <text class="bub-text" x="18" y="34">${tspans}</text>`;
  return `<g transform="translate(${rect.x},${rect.y})"><g class="bubble" style="--bd:${b.d}s;--bdur:${b.dur}s">${inner}</g></g>`;
}

}

  ${fence(150, 250, 410)}
  <g class="walker" style="--x0:1120px;--y0:415px;--x1:-220px;--y1:415px;--dur:5.6s">
    <g transform="translate(58,24) scale(.55)"><g transform="scale(-1,1)"><g class="shiverSlow" style="animation-duration:1.5s">${cowSVG(false, false)}</g></g></g>
    <g class="bob" style="--legDur:.62s;--dur:.62s"><g transform="scale(-1,1)">${cowSVG(true, false)}</g></g>

</svg>`, [], [], [
  { text: 'The light is going. They head back.', d: 0.6, dur: 2.8 },

/* 9 — Home */
add('Home', 10.5, `
<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet">

  <ellipse cx="180" cy="330" rx="360" ry="70" fill="#22303a"/>

  <g transform="translate(140,462)">${farmerSVG()}</g>

</svg>`,
  [
    { id: 'farmer', kind: 'farmer', x: 140, y: 462, s: 1 },
    { id: 'greta', kind: 'cow', x: 452, y: 444, s: 1 },

  ],
  [
    { speaker: 'farmer', lines: ['You’re the one', 'who found it.'], d: 1.5, dur: 3.1 },
    { speaker: 'farmer', lines: ['Fix the fence', 'tonight — good work.'], d: 4.8, dur: 3.2 },
    { speaker: 'greta', lines: ['Yes.'], d: 8.0, dur: 2.2 },
  ],
  [
    { text: 'The farmer waits at the barn door.', d: 0.6, dur: 2.8 },

  ]);

/* ---------------- assemble + place + render ---------------- */
function buildScene(def) {
  const characters = def.actors.map(a => ({ ...a, box: actorBBox(a) }));
  const placedBoxes = [];
  const bubbleHtml = def.bubbles.map(b => {
    const lines = b.lines;
    const textW = measureText(lines);
    const w = Math.ceil(textW + 36);
    const h = 28 + lines.length * 26;
    const speaker = characters.find(c => c.id === b.speaker);
    const rect = placeBubble({ w, h, d: b.d, dur: b.dur }, speaker, characters, placedBoxes);
    placedBoxes.push({ box: rect, d: b.d, dur: b.dur });
    return buildBubble(rect, b, speaker);
  }).join('');
  const narrationHtml = (def.narration || []).map(renderNarration).join('');
  const idx = def.svg.lastIndexOf('</svg>');
  const svg = def.svg.slice(0, idx) + bubbleHtml + narrationHtml + def.svg.slice(idx);
  return { name: def.name, dur: def.dur, svg };
}

const built = scenes.map(buildScene);
const stage = $('#stage');
stage.innerHTML = built.map((s, i) => `<section class="scene" id="s${i}">${s.svg}</section>`).join('');
const dotsBox = $('#dots');
dotsBox.innerHTML = built.map((s, i) => `<button data-i="${i}" title="${s.name}"></button>`).join('');
const dots = Array.from(dotsBox.querySelectorAll('button'));

const progFill = $('#progFill');
const segNum = $('#segNum');
const segName = $('#segName');
const btnPlay = $('#btnPlay');

let current = 0;
let timer = null;
let paused = false;
let warpBusy = false;

function restartProgress(dur) {
  progFill.style.setProperty('--dur', dur + 's');
  progFill.style.animation = 'none';
  progFill.offsetHeight;
  progFill.style.animation = '';
}

function activate(i) {
  current = (i + built.length) % built.length;
  document.querySelectorAll('.scene').forEach((el, k) => el.classList.toggle('active', k === current));
  dots.forEach((d, k) => d.classList.toggle('on', k === current));
  segNum.textContent = `Segment ${current + 1} / ${built.length}`;
  segName.textContent = built[current].name;
  restartProgress(built[current].dur);
  clearTimeout(timer);
  if (!paused) {
    timer = setTimeout(() => go(current + 1), built[current].dur * 1000);
  }
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function go(target) {
  if (warpBusy) return;
  warpBusy = true;
  const warp = $('#warp');
  warp.style.transition = 'clip-path .55s ease-in';
  warp.style.clipPath = 'circle(150% at 50% 55%)';
  const ring = $('#ring');
  ring.classList.remove('on'); void ring.offsetWidth; ring.classList.add('on');
  await wait(580);
  activate(target);
  const flash = $('#flash');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  warp.style.transition = 'clip-path .55s ease-out';
  warp.style.clipPath = 'circle(0% at 50% 55%)';
  await wait(560);
  warpBusy = false;
}

btnPlay.addEventListener('click', () => {
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  btnPlay.textContent = paused ? '▶' : '❚❚';
  if (paused) { clearTimeout(timer); }
  else { activate(current); }
});
$('#btnNext').addEventListener('click', () => go(current + 1));
$('#btnPrev').addEventListener('click', () => go(current - 1));
$('#btnRestart').addEventListener('click', () => go(0));
dots.forEach(d => d.addEventListener('click', () => go(+d.dataset.i)));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(current + 1);
  else if (e.key === 'ArrowLeft') go(current - 1);
  else if (e.key === ' ') { e.preventDefault(); btnPlay.click(); }
});

function pinToHash() {
  const probe = location.hash.match(/#s=(\d+)/);
  if (!probe) return false;
  const n = Math.min(Math.max(parseInt(probe[1], 10), 0), built.length - 1);
  activate(n);
  clearTimeout(timer);
  return true;
}

if (pinToHash()) { /* pinned to a scene via #s=N */ } else { activate(0); }
window.addEventListener('hashchange', () => { if (!pinToHash()) activate(0); });
</script>
